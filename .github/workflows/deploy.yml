name: Despliegue

# develop -> staging.salamandradigital.co
# main    -> salamandradigital.co
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'produccion' || 'staging' }}
    env:
      TARGET: ${{ github.ref_name == 'main' && '/home/belltehp/salamandradigital.co/' || '/home/belltehp/staging.salamandradigital.co/' }}
    steps:
      - uses: actions/checkout@v5

      - name: Revisar el PHP
        run: php -l site/enviar-chequeo.php

      - name: Versionar CSS y JS (evita que el navegador use una copia vieja)
        run: |
          V="${GITHUB_SHA::8}"
          find site -name '*.html' -exec sed -i -E "s#(assets/(style\.css|site\.js))\"#\1?v=$V\"#g" {} +
          grep -rl "style.css?v=$V" site | head -3

      - name: Ajustes de staging (no indexar)
        if: github.ref_name != 'main'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          rm -f site/sitemap.xml
          printf '\n<IfModule mod_headers.c>\nHeader always set X-Robots-Tag "noindex, nofollow"\n</IfModule>\n' >> site/.htaccess

      - name: Preparar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          # Quita retornos de carro de Windows (CRLF) y espacios sobrantes
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | sed -e 's/[[:space:]]*$//' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          HOST=$(printf '%s' "$SSH_HOST" | tr -d '[:space:]'); PORT=$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')
          echo "SSH_HOST=$HOST" >> "$GITHUB_ENV"; echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"
          echo "Formato de la llave: $(head -1 ~/.ssh/id_deploy)"
          if ssh-keygen -y -P '' -f ~/.ssh/id_deploy > /dev/null 2>&1; then echo "Llave privada válida y sin passphrase"; else echo "::error::La llave no es una llave privada válida o tiene passphrase"; exit 1; fi
          ssh-keyscan -T 15 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Huellas del servidor registradas: $(wc -l < ~/.ssh/known_hosts)"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            "$(printf '%s' "$SSH_USER" | tr -d '[:space:]')@$HOST" 'echo "Conexión SSH correcta"; command -v rsync' \
            || { echo "::error::No se pudo conectar por SSH (revisar usuario, puerto o que la llave pública esté autorizada)"; exit 1; }

      - name: Publicar con rsync
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          SSH_USER=$(printf '%s' "$SSH_USER" | tr -d '[:space:]')
          rsync -rlvz --checksum --delete --chmod=D755,F644 \
            --exclude='.well-known/' --exclude='cgi-bin/' --exclude='error_log' \
            --exclude='.user.ini' --exclude='php.ini' --exclude='.ftpquota' \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT -o BatchMode=yes" \
            site/ "$SSH_USER@$SSH_HOST:$TARGET"

      - name: Limpiar llave
        if: always()
        run: rm -f ~/.ssh/id_deploy
